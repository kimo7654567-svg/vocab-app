<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocabApp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingMsg">載入中...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ===== SCREEN: 選擇學生 ===== -->
<div class="screen active" id="screenStudents">
  <div class="topbar">
    <span class="topbar-title">📖 VocabApp</span>
  </div>
  <div class="container">
    <div class="card">
      <div class="section-label">選擇學生</div>
      <div id="studentListInner"><div class="muted-text">載入中...</div></div>
    </div>
    <button class="btn btn-primary" onclick="App.showAddStudentForm()">+ 新增學生</button>
    <div class="card" id="addStudentForm" style="display:none;">
      <div class="section-label" style="margin-bottom:12px;">新增學生</div>
      <input type="text" id="newStudentName" placeholder="學生姓名（例如：小明）">
      <div class="section-label">程度設定</div>
      <div class="difficulty-grid" id="addStudentLevelGrid">
        <button class="difficulty-btn selected" data-level="beginner" onclick="App.selectLevel(this)">🌱 初學<br><small>每句最多5字</small></button>
        <button class="difficulty-btn" data-level="intermediate" onclick="App.selectLevel(this)">🌿 進階<br><small>每句最多8字</small></button>
        <button class="difficulty-btn" data-level="advanced" onclick="App.selectLevel(this)">🌳 流利<br><small>正常句子</small></button>
      </div>
      <button class="btn btn-primary" onclick="App.addStudent()">建立學生</button>
      <button class="btn" onclick="App.hideAddStudentForm()">取消</button>
    </div>
  </div>
</div>

<!-- ===== SCREEN: 主選單 ===== -->
<div class="screen" id="screenHome">
  <div class="topbar">
    <button class="topbar-back" onclick="App.goTo('screenStudents')">← 返回</button>
    <span class="topbar-title" id="homeStudentName">主選單</span>
    <div style="width:60px"></div>
  </div>
  <div class="container">
    <div class="card flex-row" style="margin-bottom:1.25rem;">
      <div class="avatar" id="homeAvatar">?</div>
      <div>
        <div class="name-lg" id="homeNameDisplay">—</div>
        <div class="muted-text" id="homeLevelDisplay">—</div>
      </div>
    </div>
    <div class="action-grid">
      <button class="btn btn-primary btn-lg" onclick="App.goTo('screenWords');App.renderWordList()">📚 單字庫管理</button>
      <button class="btn btn-success btn-lg" onclick="App.startPracticeFlow()">▶ 開始練習</button>
    </div>
    <div class="card">
      <div class="section-label">學習狀態</div>
      <div class="stats-grid">
        <div class="stat-box success">
          <div class="stat-num" id="statMastered">0</div>
          <div class="stat-label">已掌握</div>
        </div>
        <div class="stat-box warning">
          <div class="stat-num" id="statStruggling">0</div>
          <div class="stat-label">練習中</div>
        </div>
        <div class="stat-box primary">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">單字總數</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== SCREEN: 單字庫 ===== -->
<div class="screen" id="screenWords">
  <div class="topbar">
    <button class="topbar-back" onclick="App.goTo('screenHome')">← 返回</button>
    <span class="topbar-title">單字庫</span>
    <div style="width:60px"></div>
  </div>
  <div class="container">
    <div class="card">
      <div class="section-label" style="margin-bottom:10px;">新增單字</div>
      <div class="input-row">
        <input type="text" id="wordInput" placeholder="輸入英文單字" onkeydown="if(event.key==='Enter')App.translateWord()">
        <button class="btn btn-primary btn-sm" onclick="App.translateWord()">翻譯</button>
      </div>
      <div class="translate-preview" id="translatePreview">
        <div>
          <div class="translate-chinese" id="translateChinese">—</div>
          <div class="muted-text sm" id="translateDifficulty">—</div>
        </div>
        <div class="flex-row gap-sm">
          <button class="btn btn-sm" onclick="App.speakWord()">🔊</button>
          <button class="btn btn-success btn-sm" onclick="App.addWordConfirm()">加入</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-label" style="margin-bottom:10px;">
        我的單字 <span id="wordCount" style="font-weight:400;color:var(--text-muted)"></span>
      </div>
      <div id="wordListInner"><div class="muted-text">還沒有單字，快來新增吧！</div></div>
    </div>
  </div>
</div>

<!-- ===== SCREEN: 選主題 ===== -->
<div class="screen" id="screenTheme">
  <div class="topbar">
    <button class="topbar-back" onclick="App.goTo('screenHome')">← 返回</button>
    <span class="topbar-title">選擇故事主題</span>
    <div style="width:60px"></div>
  </div>
  <div class="container">
    <div class="card">
      <div class="muted-text" style="margin-bottom:1rem;">今天想讀什麼主題的故事？</div>
      <div class="theme-grid">
        <button class="theme-btn" onclick="App.selectTheme(this,'animals')"><span class="theme-emoji">🦁</span>動物</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'travel')"><span class="theme-emoji">✈️</span>旅行</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'horror')"><span class="theme-emoji">👻</span>恐怖</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'food')"><span class="theme-emoji">🍕</span>食物</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'ocean')"><span class="theme-emoji">🌊</span>海洋</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'daily')"><span class="theme-emoji">🏠</span>日常</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'space')"><span class="theme-emoji">🚀</span>太空</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'magic')"><span class="theme-emoji">🪄</span>魔法</button>
        <button class="theme-btn" onclick="App.selectTheme(this,'random')"><span class="theme-emoji">🎲</span>隨機</button>
      </div>
      <button class="btn btn-primary" id="startStoryBtn" onclick="App.generateStory()" disabled>生成故事</button>
    </div>
  </div>
</div>

<!-- ===== SCREEN: 練習 ===== -->
<div class="screen" id="screenPractice">
  <div class="topbar">
    <button class="topbar-back" onclick="App.confirmExitPractice()">✕ 離開</button>
    <span class="topbar-title" id="practiceTitle">練習</span>
    <div style="width:60px"></div>
  </div>
  <div class="container">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="practiceProgress" style="width:0%"></div></div>
    <div class="tier-badge" id="tierBadge">第 1 層</div>
    <div class="steps">
      <div class="step-dot active" id="dot0"></div>
      <div class="step-dot" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>
    <div class="section-label" id="stepLabel">步驟 1：指著聽</div>
    <div class="card" id="storyCard"><div class="story-text" id="storyDisplay"></div></div>
    <div class="hunt-box" id="huntBox" style="display:none"></div>
    <div class="phonics-box" id="phonicsBox" style="display:none"></div>
    <div id="actionArea"></div>
  </div>
</div>

<!-- ===== SCREEN: 自評 ===== -->
<div class="screen" id="screenEval">
  <div class="topbar"><span class="topbar-title">今日練習回顧</span></div>
  <div class="container">
    <div class="card">
      <div class="section-label" style="margin-bottom:12px;">這次故事你覺得...</div>
      <div class="difficulty-grid">
        <button class="difficulty-btn" data-rating="easy" onclick="App.selectEvalDifficulty(this)">😴 太簡單</button>
        <button class="difficulty-btn" data-rating="good" onclick="App.selectEvalDifficulty(this)">😊 剛剛好</button>
        <button class="difficulty-btn" data-rating="hard" onclick="App.selectEvalDifficulty(this)">😅 有點難</button>
        <button class="difficulty-btn" data-rating="veryhard" onclick="App.selectEvalDifficulty(this)">😭 好難喔</button>
      </div>
    </div>
    <div class="card">
      <div class="section-label" style="margin-bottom:12px;">點出你不確定的字</div>
      <div id="evalWordBtns" style="margin-bottom:12px;"></div>
      <button class="btn btn-sm" onclick="App.clearEvalWords()">全部都會！</button>
    </div>
    <div class="card" id="bonusWordsArea" style="display:none">
      <div class="section-label" style="margin-bottom:12px;">本次新朋友 ✨ 要加入單字庫嗎？</div>
      <div id="bonusWordList"></div>
    </div>
    <button class="btn btn-primary" onclick="App.submitEval()">完成練習</button>
  </div>
</div>

<!-- ===== SCREEN: 完成 ===== -->
<div class="screen" id="screenDone">
  <div class="topbar"><span class="topbar-title">練習完成</span></div>
  <div class="container done-center">
    <div style="font-size:64px;margin-bottom:1rem;">🎉</div>
    <div class="name-lg" style="margin-bottom:8px;">太棒了！</div>
    <div class="muted-text" style="margin-bottom:2rem;" id="doneMsg">練習完成</div>
    <div class="stats-grid two-col" id="doneStats" style="margin-bottom:1.5rem;"></div>
    <button class="btn btn-primary" onclick="App.goTo('screenHome');App.updateHomeScreen()">回到主選單</button>
    <button class="btn" onclick="App.startPracticeFlow()">再練一次</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
